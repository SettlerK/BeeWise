<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#E0A02C">
<meta name="description" content="Digitale Stockkarte für Imkerinnen und Imker: Bienenvölker führen, Durchsichten protokollieren, Aufgaben automatisch nach Tracht und Wetter terminieren.">
<title>BeeWise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BeeWise">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <h1 id="kopf-titel">Heute</h1>
  <span class="datum" id="kopf-datum"></span>
</header>

<main id="ansicht"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="heute" class="an">
    <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg>
    Heute
  </button>
  <button data-tab="kalender">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
    Kalender
  </button>
  <button data-tab="voelker">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="9.5" width="16" height="5" rx="1"/><rect x="4" y="15" width="16" height="5" rx="1"/></svg>
    Völker
  </button>
  <button data-tab="tracht">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M12 9.4c0-3 1-4.4 0-6.4-1 2-2.6 3.4-2.6 6.4M14.6 12c3 0 4.4-1 6.4 0-2 1-3.4 2.6-6.4 2.6M12 14.6c0 3-1 4.4 0 6.4 1-2 2.6-3.4 2.6-6.4M9.4 12c-3 0-4.4 1-6.4 0 2-1 3.4-2.6 6.4-2.6"/></svg>
    Tracht
  </button>
  <button data-tab="mehr">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    Mehr
  </button>
</nav>

<div class="abdunkeln" id="abdunkeln"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
